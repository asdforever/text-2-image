<svg width="1440" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- ============ 背景 ============ -->
  <rect width="1440" height="900" fill="#0A0D12"/>

  <!-- ============ 顶部导航栏 ============ -->
  <rect x="0" y="0" width="1440" height="56" fill="#0F131C" stroke="#1E2636" stroke-width="1"/>
  <text x="24" y="35" fill="#E5E7EB" font-size="14" font-weight="600">← 返回项目</text>
  <text x="140" y="35" fill="#E5E7EB" font-size="15" font-weight="600">Gan65 无线充电器</text>
  <text x="340" y="35" fill="#9CA3AF" font-size="12">gan65-product</text>
  <circle cx="1400" cy="28" r="14" fill="#1E2636"/>
  <text x="1400" y="33" fill="#9CA3AF" font-size="12" text-anchor="middle">J</text>

  <!-- ============ 左侧配置面板 (360px) ============ -->
  <rect x="0" y="56" width="360" height="844" fill="#0F131C" stroke="#1E2636" stroke-width="1"/>
  <text x="24" y="90" fill="#E5E7EB" font-size="16" font-weight="600">主图生成</text>

  <!-- 产品素材上传区 -->
  <text x="24" y="125" fill="#9CA3AF" font-size="13" font-weight="600">产品素材</text>
  <rect x="24" y="135" width="312" height="180" fill="#161D2B" rx="8" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="180" y="200" fill="#38BDF8" font-size="28" text-anchor="middle">+</text>
  <text x="180" y="228" fill="#9CA3AF" font-size="13" text-anchor="middle">上传产品白底图</text>
  <text x="180" y="250" fill="#6B7280" font-size="12" text-anchor="middle">支持拖拽上传，最多8张</text>
  <text x="180" y="272" fill="#6B7280" font-size="11" text-anchor="middle">图片不是越多越好，上传必要的几张即可</text>

  <!-- 已选素材缩略图 -->
  <g transform="translate(24, 325)">
    <rect x="0" y="0" width="64" height="64" fill="#1E2636" rx="4" stroke="#38BDF8" stroke-width="2"/>
    <text x="56" y="10" fill="#38BDF8" font-size="14" font-weight="bold">✓</text>
    <rect x="74" y="0" width="64" height="64" fill="#1E2636" rx="4" stroke="#38BDF8" stroke-width="2"/>
    <text x="130" y="10" fill="#38BDF8" font-size="14" font-weight="bold">✓</text>
    <rect x="148" y="0" width="64" height="64" fill="#1E2636" rx="4" stroke="#2D3748" stroke-width="1"/>
    <rect x="222" y="0" width="64" height="64" fill="#1E2636" rx="4" stroke="#2D3748" stroke-width="1"/>
  </g>
  <text x="24" y="420" fill="#6B7280" font-size="11">已选 2 张</text>

  <!-- 创作指令（专业版） -->
  <text x="24" y="455" fill="#9CA3AF" font-size="13" font-weight="600">创作指令</text>
  <rect x="92" y="443" width="52" height="18" fill="#6366F1" rx="3"/>
  <text x="118" y="456" fill="#E5E7EB" font-size="10" text-anchor="middle">专业版</text>

  <rect x="24" y="468" width="312" height="140" fill="#161D2B" rx="8" stroke="#2D3748" stroke-width="1"/>
  <text x="36" y="492" fill="#6B7280" font-size="12">把完整的创作指令写在这里：构图、标题文案、</text>
  <text x="36" y="510" fill="#6B7280" font-size="12">风格、角色要求都含该条指令；支持按『第1张 /</text>
  <text x="36" y="528" fill="#6B7280" font-size="12">第2张...』逐张指挥，系统只把对应镜头用于对应</text>
  <text x="36" y="546" fill="#6B7280" font-size="12">模块。</text>
  <text x="320" y="598" fill="#6B7280" font-size="11" text-anchor="end">0/2000</text>

  <!-- 生成按钮 -->
  <rect x="24" y="630" width="312" height="48" fill="#38BDF8" rx="8"/>
  <text x="180" y="660" fill="#0A0D12" font-size="15" font-weight="600" text-anchor="middle">生成主图</text>

  <!-- 辅助说明 -->
  <text x="180" y="710" fill="#6B7280" font-size="11" text-anchor="middle">生成后的组图会保存在这里，可一键复用</text>

  <!-- ============ 右侧结果区 ============ -->
  <rect x="360" y="56" width="1080" height="844" fill="#0A0D12"/>

  <!-- 结果区标签页 -->
  <g transform="translate(384, 80)">
    <rect x="0" y="0" width="76" height="36" fill="#161D2B" rx="8"/>
    <text x="38" y="23" fill="#38BDF8" font-size="13" font-weight="600" text-anchor="middle">图片</text>

    <rect x="86" y="0" width="120" height="36" fill="#0F131C" rx="8" stroke="#1E2636" stroke-width="1"/>
    <text x="146" y="23" fill="#9CA3AF" font-size="13" text-anchor="middle">富文本 Beta</text>

    <rect x="216" y="0" width="100" height="36" fill="#0F131C" rx="8" stroke="#1E2636" stroke-width="1"/>
    <text x="266" y="23" fill="#9CA3AF" font-size="13" text-anchor="middle">内测版</text>
  </g>

  <!-- 主图结果网格 (3列) -->
  <g transform="translate(384, 140)">
    <!-- 卡片 1 -->
    <rect x="0" y="0" width="330" height="320" fill="#0F131C" rx="8" stroke="#1E2636" stroke-width="1"/>
    <rect x="12" y="12" width="306" height="250" fill="#161D2B" rx="4"/>
    <text x="165" y="145" fill="#6B7280" font-size="14" text-anchor="middle">主图预览</text>
    <text x="20" y="282" fill="#E5E7EB" font-size="12" font-weight="600">主图-产品01</text>
    <text x="20" y="302" fill="#6B7280" font-size="11">1:1 方形 · 标准版</text>

    <!-- 卡片 2 -->
    <rect x="345" y="0" width="330" height="320" fill="#0F131C" rx="8" stroke="#1E2636" stroke-width="1"/>
    <rect x="357" y="12" width="306" height="250" fill="#161D2B" rx="4"/>
    <text x="510" y="145" fill="#6B7280" font-size="14" text-anchor="middle">主图预览</text>
    <text x="365" y="282" fill="#E5E7EB" font-size="12" font-weight="600">主图-产品02</text>
    <text x="365" y="302" fill="#6B7280" font-size="11">1:1 方形 · 标准版</text>

    <!-- 卡片 3 -->
    <rect x="690" y="0" width="330" height="320" fill="#0F131C" rx="8" stroke="#1E2636" stroke-width="1"/>
    <rect x="702" y="12" width="306" height="250" fill="#161D2B" rx="4"/>
    <text x="855" y="145" fill="#6B7280" font-size="14" text-anchor="middle">主图预览</text>
    <text x="710" y="282" fill="#E5E7EB" font-size="12" font-weight="600">主图-产品03</text>
    <text x="710" y="302" fill="#6B7280" font-size="11">3:4 竖版 · 场景化</text>

    <!-- 卡片 4 -->
    <rect x="0" y="340" width="330" height="320" fill="#0F131C" rx="8" stroke="#1E2636" stroke-width="1"/>
    <rect x="12" y="352" width="306" height="250" fill="#161D2B" rx="4"/>
    <text x="165" y="485" fill="#6B7280" font-size="14" text-anchor="middle">主图预览</text>
    <text x="20" y="622" fill="#E5E7EB" font-size="12" font-weight="600">主图-产品04</text>
    <text x="20" y="642" fill="#6B7280" font-size="11">16:9 横版 · 简约风</text>
  </g>

  <!-- 导出按钮 -->
  <rect x="1280" y="80" width="136" height="36" fill="#0F131C" rx="8" stroke="#1E2636" stroke-width="1"/>
  <text x="1348" y="103" fill="#E5E7EB" font-size="12" text-anchor="middle">导出主图 ZIP</text>

  <!-- 分隔线 -->
  <line x1="360" y1="56" x2="360" y2="900" stroke="#1E2636" stroke-width="1"/>
</svg>
