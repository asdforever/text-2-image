<svg width="1440" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- ============ 背景 ============ -->
  <rect width="1440" height="900" fill="#0A0D12"/>

  <!-- ============ 顶部导航栏 ============ -->
  <rect x="0" y="0" width="1440" height="56" fill="#0F131C" stroke="#1E2636" stroke-width="1"/>
  <text x="24" y="35" fill="#E5E7EB" font-size="14" font-weight="600">← 返回项目</text>
  <text x="140" y="35" fill="#E5E7EB" font-size="15" font-weight="600">Gan65 无线充电器</text>
  <text x="340" y="35" fill="#9CA3AF" font-size="12">gan65-product</text>
  <circle cx="1400" cy="28" r="14" fill="#1E2636"/>
  <text x="1400" y="33" fill="#9CA3AF" font-size="12" text-anchor="middle">J</text>

  <!-- ============ 左侧配置面板 (360px) ============ -->
  <rect x="0" y="56" width="360" height="844" fill="#0F131C" stroke="#1E2636" stroke-width="1"/>
  <text x="24" y="90" fill="#E5E7EB" font-size="16" font-weight="600">详情页生成</text>

  <!-- 产品素材上传区 -->
  <text x="24" y="125" fill="#9CA3AF" font-size="13" font-weight="600">产品素材</text>
  <rect x="24" y="135" width="312" height="120" fill="#161D2B" rx="8" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="180" y="180" fill="#38BDF8" font-size="26" text-anchor="middle">+</text>
  <text x="180" y="205" fill="#9CA3AF" font-size="13" text-anchor="middle">图片上传到这里</text>
  <text x="180" y="225" fill="#6B7280" font-size="11" text-anchor="middle">最多可同时上传 4 张</text>

  <!-- 已上传缩略图 -->
  <g transform="translate(24, 265)">
    <rect x="0" y="0" width="58" height="58" fill="#1E2636" rx="4" stroke="#38BDF8" stroke-width="2"/>
    <rect x="68" y="0" width="58" height="58" fill="#1E2636" rx="4" stroke="#38BDF8" stroke-width="2"/>
  </g>

  <!-- 组件编号 -->
  <text x="24" y="365" fill="#9CA3AF" font-size="13" font-weight="600">组件编号</text>
  <rect x="24" y="375" width="312" height="36" fill="#161D2B" rx="6" stroke="#2D3748" stroke-width="1"/>
  <text x="36" y="398" fill="#6B7280" font-size="12">选择第几张组件（默认全部）</text>
  <text x="325" y="398" fill="#6B7280" font-size="13" text-anchor="end">▼</text>

  <!-- 创作指令（专业版） -->
  <text x="24" y="440" fill="#9CA3AF" font-size="13" font-weight="600">创作指令</text>
  <rect x="92" y="428" width="52" height="18" fill="#6366F1" rx="3"/>
  <text x="118" y="441" fill="#E5E7EB" font-size="10" text-anchor="middle">专业版</text>

  <rect x="24" y="453" width="312" height="100" fill="#161D2B" rx="6" stroke="#2D3748" stroke-width="1"/>
  <text x="36" y="475" fill="#6B7280" font-size="12">输入详细创作指令...</text>
  <text x="320" y="543" fill="#6B7280" font-size="11" text-anchor="end">0/2000</text>

  <!-- 输出样式 -->
  <text x="24" y="580" fill="#9CA3AF" font-size="12" font-weight="600">输出样式</text>
  <rect x="24" y="590" width="150" height="32" fill="#161D2B" rx="6" stroke="#2D3748" stroke-width="1"/>
  <text x="36" y="611" fill="#E5E7EB" font-size="12">标准版</text>
  <text x="162" y="611" fill="#6B7280" font-size="12" text-anchor="end">▼</text>

  <!-- 尺寸 -->
  <text x="186" y="580" fill="#9CA3AF" font-size="12" font-weight="600">尺寸</text>
  <rect x="186" y="590" width="150" height="32" fill="#161D2B" rx="6" stroke="#2D3748" stroke-width="1"/>
  <text x="198" y="611" fill="#E5E7EB" font-size="12">1200×1200</text>
  <text x="324" y="611" fill="#6B7280" font-size="12" text-anchor="end">▼</text>

  <!-- 模型 -->
  <text x="24" y="648" fill="#9CA3AF" font-size="12" font-weight="600">模型</text>
  <rect x="24" y="658" width="312" height="32" fill="#161D2B" rx="6" stroke="#2D3748" stroke-width="1"/>
  <text x="36" y="679" fill="#E5E7EB" font-size="12">GPT Image 2.5 Flux</text>
  <text x="324" y="679" fill="#6B7280" font-size="12" text-anchor="end">▼</text>

  <!-- 电商销售场景标签 -->
  <text x="24" y="720" fill="#9CA3AF" font-size="13" font-weight="600">电商销售场景</text>
  <text x="24" y="738" fill="#6B7280" font-size="11">选择促销场景，自动载入对应话术</text>

  <!-- 场景标签（3列） -->
  <g transform="translate(24, 748)">
    <rect x="0" y="0" width="96" height="26" fill="#38BDF8" rx="13"/>
    <text x="48" y="17" fill="#0A0D12" font-size="11" font-weight="600" text-anchor="middle">直邮包邮</text>
    <rect x="106" y="0" width="96" height="26" fill="#161D2B" rx="13" stroke="#2D3748" stroke-width="1"/>
    <text x="154" y="17" fill="#9CA3AF" font-size="11" text-anchor="middle">质量保障</text>
    <rect x="212" y="0" width="96" height="26" fill="#38BDF8" rx="13"/>
    <text x="260" y="17" fill="#0A0D12" font-size="11" font-weight="600" text-anchor="middle">高性价比</text>

    <rect x="0" y="34" width="96" height="26" fill="#161D2B" rx="13" stroke="#2D3748" stroke-width="1"/>
    <text x="48" y="51" fill="#9CA3AF" font-size="11" text-anchor="middle">皮质质感</text>
    <rect x="106" y="34" width="96" height="26" fill="#161D2B" rx="13" stroke="#2D3748" stroke-width="1"/>
    <text x="154" y="51" fill="#9CA3AF" font-size="11" text-anchor="middle">金属光泽</text>
    <rect x="212" y="34" width="96" height="26" fill="#38BDF8" rx="13"/>
    <text x="260" y="51" fill="#0A0D12" font-size="11" font-weight="600" text-anchor="middle">易清洁</text>
  </g>

  <!-- 更多场景提示 -->
  <text x="24" y="830" fill="#38BDF8" font-size="11">展开全部 40+ 场景标签</text>

  <!-- 生成按钮 -->
  <rect x="24" y="848" width="312" height="48" fill="#38BDF8" rx="8"/>
  <text x="180" y="878" fill="#0A0D12" font-size="15" font-weight="600" text-anchor="middle">生成详情页</text>

  <!-- ============ 右侧结果区 ============ -->
  <rect x="360" y="56" width="1080" height="844" fill="#0A0D12"/>

  <!-- 结果区标题 -->
  <text x="384" y="90" fill="#E5E7EB" font-size="15" font-weight="600">生成结果</text>
  <text x="384" y="110" fill="#6B7280" font-size="12">详情页模块列表</text>

  <!-- 导出按钮 -->
  <rect x="1280" y="80" width="136" height="36" fill="#0F131C" rx="8" stroke="#1E2636" stroke-width="1"/>
  <text x="1348" y="103" fill="#E5E7EB" font-size="12" text-anchor="middle">导出套图 ZIP</text>

  <!-- 详情页结果卡片列表 -->
  <g transform="translate(384, 140)">
    <!-- 卡片 1 -->
    <rect x="0" y="0" width="1010" height="180" fill="#0F131C" rx="8" stroke="#1E2636" stroke-width="1"/>
    <rect x="14" y="14" width="240" height="152" fill="#161D2B" rx="4"/>
    <text x="134" y="95" fill="#6B7280" font-size="13" text-anchor="middle">详情页模块预览</text>

    <text x="270" y="32" fill="#E5E7EB" font-size="14" font-weight="600">详情页 - 产品01</text>
    <text x="270" y="55" fill="#9CA3AF" font-size="12">1200×1200 · 标准版 · GPT Image 2.5 Flux</text>
    <text x="270" y="77" fill="#6B7280" font-size="11">场景: 直邮包邮, 高性价比, 易清洁</text>
    <text x="270" y="97" fill="#6B7280" font-size="11">生成时间: 2026-09-12 14:32</text>

    <rect x="270" y="115" width="96" height="32" fill="#161D2B" rx="6" stroke="#2D3748" stroke-width="1"/>
    <text x="318" y="136" fill="#E5E7EB" font-size="12" text-anchor="middle">重新生成</text>
    <rect x="376" y="115" width="72" height="32" fill="#161D2B" rx="6" stroke="#2D3748" stroke-width="1"/>
    <text x="412" y="136" fill="#E5E7EB" font-size="12" text-anchor="middle">导出</text>
    <rect x="458" y="115" width="72" height="32" fill="#161D2B" rx="6" stroke="#2D3748" stroke-width="1"/>
    <text x="494" y="136" fill="#EF4444" font-size="12" text-anchor="middle">删除</text>

    <!-- 卡片 2 -->
    <rect x="0" y="200" width="1010" height="180" fill="#0F131C" rx="8" stroke="#1E2636" stroke-width="1"/>
    <rect x="14" y="214" width="240" height="152" fill="#161D2B" rx="4"/>
    <text x="134" y="295" fill="#6B7280" font-size="13" text-anchor="middle">详情页模块预览</text>

    <text x="270" y="232" fill="#E5E7EB" font-size="14" font-weight="600">详情页 - 产品02</text>
    <text x="270" y="255" fill="#9CA3AF" font-size="12">800×800 · 简约版 · GPT Image 2.5 Flux</text>
    <text x="270" y="277" fill="#6B7280" font-size="11">场景: 质量保障, 皮质质感</text>

    <!-- 卡片 3 -->
    <rect x="0" y="400" width="1010" height="180" fill="#0F131C" rx="8" stroke="#1E2636" stroke-width="1"/>
    <rect x="14" y="414" width="240" height="152" fill="#161D2B" rx="4"/>
    <text x="134" y="495" fill="#6B7280" font-size="13" text-anchor="middle">详情页模块预览</text>

    <text x="270" y="432" fill="#E5E7EB" font-size="14" font-weight="600">详情页 - 产品03（场景化）</text>
    <text x="270" y="455" fill="#9CA3AF" font-size="12">1200×1200 · 场景化 · GPT Image 2.5 Flux</text>
  </g>

  <!-- 分隔线 -->
  <line x1="360" y1="56" x2="360" y2="900" stroke="#1E2636" stroke-width="1"/>
</svg>
