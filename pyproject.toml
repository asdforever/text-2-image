[project]
name = "picagent-fastapi-backend"
version = "0.1.0"
description = "FastAPI backend scaffold for PicAgent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "asyncpg>=0.29,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "minio>=7.2,<8.0",
  "pillow>=10.0,<12.0",
  "cryptography>=43,<51",
  # httpx 是运行时依赖：app/providers/openai_compatible.py 会 import 它。
  # Dockerfile 只装 project.dependencies，别把它挪回 dev extras。
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
